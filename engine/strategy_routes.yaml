# Strategy route records - routing as structured, scoped data.
#
# One record per known problem shape. A record is STEERING, never authority:
# it grants no execution permission and touches no ledger, oracle or replay.
# See engine/strategy_routes.py for the schema and the trust boundary.
#
# `target` and `why` are strategy prose on purpose (the field naming the
# sub-object is `target` - a bare `on` key is YAML 1.1's boolean True).
# What this format makes
# testable is everything AROUND that prose: the schema, the tactic/control
# references, the producer/consumer links, the shape matcher, the rendered
# delivery, and the recorded historical effect.
version: 1

routes:
  - id: indefinite-reduction-with-boundary-term
    summary: >-
      an INDEFINITE reduction identity that carries an explicit boundary term
      outside the integrals, with the ask being the constants rather than an
      integration
    match:
      all:
        - feature: indefinite_integral_count
          min: 3
        - feature: relation_has_explicit_nonintegral_term
        - feature: shifted_integral_count
          min: 1
        # symbol-GENERIC on purpose. Naming `[A, B, C]` made the same
        # problem posed in `\alpha,\beta,\gamma` a non-match, and a route
        # that silently stops matching turns a measurement arm into a
        # control. The plural is what the shape needs; the arity is not.
        - feature: asked_symbol_count
          min: 2
        - feature: parameter_constraint_count
          min: 1
    avoid:
      - tactic: integrate_reduction
        why: >-
          its structural fence takes one integral family on each side, so an
          identity carrying a boundary term is outside it - that is a fact
          about one tactic's fence, never a reason to declare the task open
    stages:
      - id: differentiate-boundary
        action: tactic
        tactic: diff
        target: the explicit boundary term of the identity
        produces: derivative-identity
        why: >-
          the identity is proved by differentiation, not by integrating
          anything; differentiating the boundary term is what turns it into
          checkable algebra
        required: true
      - id: certify-algebra
        action: tactic
        tactic: equal
        target: each algebraic identity used to rewrite that derivative
        why: certify the algebra before coefficient matching consumes it
      - id: form-coefficient-system
        action: tactic
        tactic: match_coefficients
        target: >-
          the derivative identity, matched in whatever object it is
          polynomial in - the trig atom itself (`\cos x`) when there is one,
          never a stand-in variable retyped by hand
        consumes: derivative-identity
        produces: coefficient-system
        why: >-
          turn the polynomial identity into equations for the unknown
          constants; a retyped identity would be a premise that no step
          derived, putting the whole system outside what was checked
        required: true
      - id: isolate-assignments
        action: tactic-loop
        tactics: [apply, expand, substitute]
        consumes: coefficient-system
        produces: coefficient-assignments
        why: >-
          isolate one recorded `unknown = value` step per constant; the
          assembly stage reads exactly those. When the rows are COUPLED,
          substituting an already-isolated value back into the remaining
          rows and isolating again IS the elimination - there is no separate
          row-combining move to go looking for. Orientation is not a
          blocker either: a row derived as `value = unknown` is read in
          both orders, so it needs no flipping - and none is possible,
          since `equal?` compares relations side by side
      - id: assemble-answer
        action: tactic
        tactic: system_assemble
        consumes: coefficient-assignments
        produces: assembled-coefficients
        role: provenance-endpoint
        why: >-
          this is the provenance-bearing endpoint for the constants, not one
          more optional name - without it the isolated values are a set of
          separate steps and no single verified answer exists
        required: true
      - id: designate
        action: control
        tool: set_result
        consumes: assembled-coefficients
        why: >-
          the certified content is the checked derivative identity plus the
          assembled constants; no integration step is recorded and none is
          needed when the ask is the constants
    evidence:
      fixture: indefinite-reduction-boundary-v1
      observations:
        - condition: handwritten-skill-route
          metric: closed
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 3
          runs: 3
        - condition: skill-route-deleted
          metric: closed
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 0
          runs: 6
        - condition: generated-tactic-name-route
          metric: closed
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 2
          runs: 3
        # This record, delivered with the handwritten paragraph REMOVED,
        # against an interleaved deletion control. Stopped early at n=2 per
        # arm, so read it as directional, not as an effect size. `closed` is
        # deliberately not the metric: one control run designated only A,
        # which closes nothing the instruction asked for.
        - condition: route-record-only
          metric: correct-A-B-C
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 2
          runs: 2
        - condition: route-record-only
          metric: required-stage-reach
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 2
          runs: 2
        - condition: no-route-no-paragraph
          metric: correct-A-B-C
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 1
          runs: 2
        - condition: no-route-no-paragraph
          metric: required-stage-reach
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 0
          runs: 2
    provenance:
      notebook: examples/int1.ipynb
      cell_label: 6

# Executable corpus. Each entry is a COPY of an exact instruction, never a
# reference to a notebook cell: notebooks are user-modified and a cell index
# drifts. Negatives are chosen to be HARD - each shares surface features with
# the positives and must still not match.
#
# The corpus measures TWO numbers, and shipping one without the other is the
# failure mode this file guards against: recall over `positive` (natural
# rewordings of the same problem) and precision over `negative`. Recall
# matters because reach can only be measured on runs that MATCH - a
# paraphrased instruction silently turns a routed arm into an unrouted
# control and reports the difference as noise.
#
# `unmatched` is the third list and the honest one: instructions this record
# deliberately does NOT match, each with its reason. It is not a negative
# (these are not the wrong shape) and not a positive (they do not match).
# Committing them keeps a known limit visible and stops it changing silently.
fixtures:
  indefinite-reduction-boundary-v1:
    positive:
      # the exact motivating instruction, verbatim after the `do!` prefix
      - |
        prove \begin{aligned}
        & \int \frac{d x}{(a+b \cos x)^n}=\frac{A \sin x}{(a+b \cos x)^{n-1}}+ \\
        & +B \int \frac{d x}{(a+b \cos x)^{n-1}}+C \int \frac{d x}{(a+b \cos x)^{n-2}}(|a| \neq|b|)
        \end{aligned} if n > 1. Find A,B and C
      # the same shape written on one line, without the environment: the
      # matcher must key on structure, not on `aligned`
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{A x}{(1+x^2)^{n-1}} + B \int \frac{dx}{(1+x^2)^{n-1}} + C \int \frac{dx}{(1+x^2)^{n-2}} for n > 2. Find A, B and C
      # --- rewordings of the ASK. Same mathematical content, different
      # English; every one of these was a MEASURED miss before the recall
      # round, and each names its miss shape.
      # noun phrase between the ask verb and the letters
      - |
        prove \int \frac{dx}{(x^2+a^2)^n} = \frac{A x}{(x^2+a^2)^{n-1}} + B \int \frac{dx}{(x^2+a^2)^{n-1}} + C \int \frac{dx}{(x^2+a^2)^{n-2}} for n > 2. Find the constants A, B, C
      # a longer noun phrase, ending in a preposition
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{A x}{(1+x^2)^{n-1}} + B \int \frac{dx}{(1+x^2)^{n-1}} + C \int \frac{dx}{(1+x^2)^{n-2}} for n > 2. Find the values of A,B,C
      # a NON-IMPERATIVE ask: the first vocabulary had imperatives only
      - |
        prove \int \frac{dx}{(a+b \cos x)^n} = \frac{A \sin x}{(a+b \cos x)^{n-1}} + B \int \frac{dx}{(a+b \cos x)^{n-1}} + C \int \frac{dx}{(a+b \cos x)^{n-2}} for n > 1. What are A, B and C?
      # the stated domain trails the ask in the SAME sentence, which used to
      # swallow the last symbol and drop the count below the bound
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{A x}{(1+x^2)^{n-1}} + B \int \frac{dx}{(1+x^2)^{n-1}} + C \int \frac{dx}{(1+x^2)^{n-2}}. Determine A, B, C for n > 2
      # the same problem posed in Greek letters: extraction AND matching must
      # both be symbol-generic, which is why no record may name its symbols
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{\alpha x}{(1+x^2)^{n-1}} + \beta \int \frac{dx}{(1+x^2)^{n-1}} + \gamma \int \frac{dx}{(1+x^2)^{n-2}} for n > 2. Find \alpha, \beta and \gamma
      # another ask verb, another noun
      - |
        prove \int \frac{dx}{(x^2+a^2)^n} = \frac{A x}{(x^2+a^2)^{n-1}} + B \int \frac{dx}{(x^2+a^2)^{n-1}} + C \int \frac{dx}{(x^2+a^2)^{n-2}} for n > 2. Calculate the coefficients A, B and C
      # a two-word ask verb
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{A x}{(1+x^2)^{n-1}} + B \int \frac{dx}{(1+x^2)^{n-1}} + C \int \frac{dx}{(1+x^2)^{n-2}} for n > 2. Solve for A, B and C
      # a numeral inside the noun phrase
      - |
        prove \int \frac{dx}{(a+b \cos x)^n} = \frac{A \sin x}{(a+b \cos x)^{n-1}} + B \int \frac{dx}{(a+b \cos x)^{n-1}} + C \int \frac{dx}{(a+b \cos x)^{n-2}} for n > 1. Identify the three constants A, B and C
      # subscripted unknowns
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{C_1 x}{(1+x^2)^{n-1}} + C_2 \int \frac{dx}{(1+x^2)^{n-1}} + C_3 \int \frac{dx}{(1+x^2)^{n-2}} for n > 2. Find the constants C_1, C_2 and C_3
    negative:
      # a DEFINITE reduction formula: integrate_reduction's own shape, which
      # this record explicitly tells the agent to avoid
      - |
        prove I_n = \int_0^{+\infty} \frac{dx}{\operatorname{ch}^{n+1} x} = \frac{n-1}{n} \int_0^{+\infty} \frac{dx}{\operatorname{ch}^{n-1} x} for n > 1
      # the symbol ask fires, the shape does not: partial fractions has one
      # integral and no reduction identity
      - |
        \int \frac{dx}{(x-1)(x-2)(x-3)} by partial fractions \frac{A}{x-1}+\frac{B}{x-2}+\frac{C}{x-3}. Find A, B and C
      # the identity shape fires, the ask does not: nothing is unknown here
      - |
        prove \int \sin^n x\,dx = -\frac{\sin^{n-1} x \cos x}{n} + \frac{n-1}{n} \int \sin^{n-2} x\,dx + \int 0\,dx for n > 1
      # integrals in a sum, but no boundary term outside them and no shift
      - |
        prove \int (f + g + h)\,dx = \int f\,dx + \int g\,dx + \int h\,dx
      # an ordinary indefinite integral cell
      - |
        Integrate \int \frac{d x}{2 \sin x-\cos x+5} using verified tactics only.
      # --- one hard negative per WIDENING made by the recall round. Each
      # fires the widened feature and must still be refused on shape.
      # non-imperative ask, on the DEFINITE analogue of the positive: the
      # ask, the boundary term, the shift and the domain all fire, and the
      # boundedness of the integrals is the only thing refusing it
      - |
        prove \int_0^{\pi/2} \frac{dx}{(a+b \cos x)^n} = \frac{A \sin x}{(a+b \cos x)^{n-1}} + B \int_0^{\pi/2} \frac{dx}{(a+b \cos x)^{n-1}} + C \int_0^{\pi/2} \frac{dx}{(a+b \cos x)^{n-2}} for n > 1. What are A, B and C?
      # three GREEK unknowns in a different problem family: symbol-generic
      # extraction must not make partial fractions look like a reduction
      - |
        \int \frac{dx}{(x-1)(x-2)(x-3)} by partial fractions \frac{\alpha}{x-1}+\frac{\beta}{x-2}+\frac{\gamma}{x-3} for x > 3. Find the constants \alpha, \beta and \gamma
      # exactly TWO unknowns, reached through the trailing-clause cut: this
      # is the negative for `asked_symbol_count: min 2` rather than min 3
      - |
        Determine the constants A and B for which \int (A f + B g)\,dx = 0 whenever n > 2.
      # a noun-phrase lead-in the closed vocabulary must NOT swallow, on a
      # problem with no integral at all
      - |
        What are the roots A and B of x^2 - 5x + 6 = 0 for x > 0?
      # a definite reduction that names its constants: both the ask and the
      # shift fire, and the family is still integrate_reduction's
      - |
        prove \int_0^1 x^n e^{-x} dx = A + B \int_0^1 x^{n-1} e^{-x} dx + C \int_0^1 x^{n-2} e^{-x} dx for n > 2. Find the values of A, B and C
    unmatched:
      - why: >-
          the stated parameter domain is part of this shape's mathematical
          content, not of its phrasing, so dropping it is an ablation rather
          than a rewording and the record keeps requiring it. MEASURED
          caveat, recorded so a later round can revisit with evidence rather
          than taste: `parameter_constraint_count` refuses 3 of the 10 hard
          negatives but is never the ONLY predicate refusing one, so its
          marginal discrimination on this corpus is zero. It is also the
          record's only predicate on the parser leg of the hybrid extractor.
        instruction: |
          prove \int \frac{dx}{(1+x^2)^n} = \frac{A x}{(1+x^2)^{n-1}} + B \int \frac{dx}{(1+x^2)^{n-1}} + C \int \frac{dx}{(1+x^2)^{n-2}}. Find A, B and C
