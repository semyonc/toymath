# Strategy route records - routing as structured, scoped data.
#
# One record per known problem shape. A record is STEERING, never authority:
# it grants no execution permission and touches no ledger, oracle or replay.
# See engine/strategy_routes.py for the schema and the trust boundary.
#
# `on` and `why` are strategy prose on purpose. What this format makes
# testable is everything AROUND that prose: the schema, the tactic/control
# references, the producer/consumer links, the shape matcher, the rendered
# delivery, and the recorded historical effect.
version: 1

routes:
  - id: indefinite-reduction-with-boundary-term
    summary: >-
      an INDEFINITE reduction identity that carries an explicit boundary term
      outside the integrals, with the ask being the constants rather than an
      integration
    match:
      all:
        - feature: indefinite_integral_count
          min: 3
        - feature: relation_has_explicit_nonintegral_term
        - feature: shifted_integral_count
          min: 1
        - feature: asks_for_symbols
          symbols: [A, B, C]
        - feature: parameter_constraint_count
          min: 1
    avoid:
      - tactic: integrate_reduction
        why: >-
          its structural fence takes one integral family on each side, so an
          identity carrying a boundary term is outside it - that is a fact
          about one tactic's fence, never a reason to declare the task open
    stages:
      - id: differentiate-boundary
        action: tactic
        tactic: diff
        target: the explicit boundary term of the identity
        produces: derivative-identity
        why: >-
          the identity is proved by differentiation, not by integrating
          anything; differentiating the boundary term is what turns it into
          checkable algebra
        required: true
      - id: certify-algebra
        action: tactic
        tactic: equal
        target: each algebraic identity used to rewrite that derivative
        why: certify the algebra before coefficient matching consumes it
      - id: form-coefficient-system
        action: tactic
        tactic: match_coefficients
        consumes: derivative-identity
        produces: coefficient-system
        why: >-
          turn the polynomial identity into equations for the unknown
          constants
        required: true
      - id: isolate-assignments
        action: tactic-loop
        tactics: [apply, expand, substitute]
        consumes: coefficient-system
        produces: coefficient-assignments
        why: >-
          isolate one recorded `unknown = value` step per constant; the
          assembly stage reads exactly those
      - id: assemble-answer
        action: tactic
        tactic: system_assemble
        consumes: coefficient-assignments
        produces: assembled-coefficients
        role: provenance-endpoint
        why: >-
          this is the provenance-bearing endpoint for the constants, not one
          more optional name - without it the isolated values are a set of
          separate steps and no single verified answer exists
        required: true
      - id: designate
        action: control
        tool: set_result
        consumes: assembled-coefficients
        why: >-
          the certified content is the checked derivative identity plus the
          assembled constants; no integration step is recorded and none is
          needed when the ask is the constants
    evidence:
      fixture: indefinite-reduction-boundary-v1
      observations:
        - condition: handwritten-skill-route
          metric: closed
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 3
          runs: 3
        - condition: skill-route-deleted
          metric: closed
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 0
          runs: 6
        - condition: generated-tactic-name-route
          metric: closed
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 2
          runs: 3
        # This record, delivered with the handwritten paragraph REMOVED,
        # against an interleaved deletion control. Stopped early at n=2 per
        # arm, so read it as directional, not as an effect size. `closed` is
        # deliberately not the metric: one control run designated only A,
        # which closes nothing the instruction asked for.
        - condition: route-record-only
          metric: correct-A-B-C
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 2
          runs: 2
        - condition: route-record-only
          metric: required-stage-reach
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 2
          runs: 2
        - condition: no-route-no-paragraph
          metric: correct-A-B-C
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 1
          runs: 2
        - condition: no-route-no-paragraph
          metric: required-stage-reach
          model: gpt-5.6-terra
          date: '2026-08-08'
          successes: 0
          runs: 2
    provenance:
      notebook: examples/int1.ipynb
      cell_label: 6

# Executable corpus. Each entry is a COPY of an exact instruction, never a
# reference to a notebook cell: notebooks are user-modified and a cell index
# drifts. Negatives are chosen to be HARD - each shares surface features with
# the positives and must still not match.
fixtures:
  indefinite-reduction-boundary-v1:
    positive:
      # the exact motivating instruction, verbatim after the `do!` prefix
      - |
        prove \begin{aligned}
        & \int \frac{d x}{(a+b \cos x)^n}=\frac{A \sin x}{(a+b \cos x)^{n-1}}+ \\
        & +B \int \frac{d x}{(a+b \cos x)^{n-1}}+C \int \frac{d x}{(a+b \cos x)^{n-2}}(|a| \neq|b|)
        \end{aligned} if n > 1. Find A,B and C
      # the same shape written on one line, without the environment: the
      # matcher must key on structure, not on `aligned`
      - |
        prove \int \frac{dx}{(1+x^2)^n} = \frac{A x}{(1+x^2)^{n-1}} + B \int \frac{dx}{(1+x^2)^{n-1}} + C \int \frac{dx}{(1+x^2)^{n-2}} for n > 2. Find A, B and C
    negative:
      # a DEFINITE reduction formula: integrate_reduction's own shape, which
      # this record explicitly tells the agent to avoid
      - |
        prove I_n = \int_0^{+\infty} \frac{dx}{\operatorname{ch}^{n+1} x} = \frac{n-1}{n} \int_0^{+\infty} \frac{dx}{\operatorname{ch}^{n-1} x} for n > 1
      # the symbol ask fires, the shape does not: partial fractions has one
      # integral and no reduction identity
      - |
        \int \frac{dx}{(x-1)(x-2)(x-3)} by partial fractions \frac{A}{x-1}+\frac{B}{x-2}+\frac{C}{x-3}. Find A, B and C
      # the identity shape fires, the ask does not: nothing is unknown here
      - |
        prove \int \sin^n x\,dx = -\frac{\sin^{n-1} x \cos x}{n} + \frac{n-1}{n} \int \sin^{n-2} x\,dx + \int 0\,dx for n > 1
      # integrals in a sum, but no boundary term outside them and no shift
      - |
        prove \int (f + g + h)\,dx = \int f\,dx + \int g\,dx + \int h\,dx
      # an ordinary indefinite integral cell
      - |
        Integrate \int \frac{d x}{2 \sin x-\cos x+5} using verified tactics only.
