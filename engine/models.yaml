# Models offered by `model!` in a ToyMath notebook. Provider order is
# optional. When present, ToyMath sends it to OpenRouter with fallbacks off.
models:
  - model: anthropic/claude-sonnet-5
  - model: openai/gpt-5.6-luna
  - model: google/gemini-3.6-flash
  - model: deepseek/deepseek-v4-flash
  - model: z-ai/glm-5.2
    providers:
      - Cerebras
      - Fireworks
  - model: xiaomi/mimo-v2.5
